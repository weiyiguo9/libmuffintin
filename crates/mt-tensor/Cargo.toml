[package]
name = "libmuffintin-tensor"
description = "Local tensor substrate with a backend-neutral einsum layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "muffintin_tensor"

[features]
default = ["backend-rstsr"]
backend-rstsr = ["dep:rstsr", "dep:tblis-src"]
# Second local einsum engine. tenferro-einsum 0.3.0 needs rustc 1.96; the
# workspace MSRV stays 1.89. Enable only after raising rust-version locally.
backend-tenferro = [
    "backend-rstsr",
    "dep:tenferro-einsum",
    "dep:tenferro-tensor",
    "dep:tenferro-cpu",
]

[dependencies]
num-complex.workspace = true
rstsr = { version = "0.7.10", optional = true, default-features = false, features = ["std", "faer", "row_major", "tblis"] }
tblis-src = { version = "0.2.6", optional = true, features = ["build_from_source"] }
tenferro-cpu = { version = "0.3.0", optional = true, default-features = false, features = ["cpu-faer"] }
tenferro-einsum = { version = "0.3.0", optional = true, default-features = false, features = ["cpu-faer"] }
tenferro-tensor = { version = "0.3.0", optional = true, default-features = false }
thiserror.workspace = true

[lints]
workspace = true
