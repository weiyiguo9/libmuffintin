[blocker]
missing_dy_bcc_dft = true
missing_spex_or_fleur_snapshot_v2_importer = true
fleur_converter_frozen = true
spex_sm_artifacts_are_native_not_snapshot_v2 = true
synthetic_hydrogen_or_atomic_only_dy_forbidden = true
statement = """No honest libmuffintin-consumable Dy bcc Snapshot V2 exists. The WSL experiment tree produced only scalar-collinear fcc Sm SPEX dumps (spex.inp/spex.pot/thc_orbitals*.bin). FLEUR conversion is frozen. SPEX exchange_hdf is not a full-first-variation spinor consumer. Do not substitute synthetic atomic data for Dy material evidence."""
