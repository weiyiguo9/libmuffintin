[package]
name = "libmuffintin-io"
description = "Versioned text snapshots, grid artifacts, and MLDUMP HDF5 interchange for libmuffintin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "muffintin_io"

[dependencies]
hdf5-metno = "=0.12.3"
libmuffintin-grid = { path = "../mt-grid" }
serde = { version = "1.0.219", features = ["derive"] }
thiserror.workspace = true
toml = "0.8.20"

[dev-dependencies]
libmuffintin-core = { path = "../mt-core" }

[lints]
workspace = true
