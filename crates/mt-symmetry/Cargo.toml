[package]
name = "libmuffintin-symmetry"
description = "Method-neutral crystal symmetry dataset with a moyo detection backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "muffintin_symmetry"

[features]
default = ["backend-moyo"]
backend-moyo = ["dep:moyo", "dep:nalgebra"]

[dependencies]
libmuffintin-core = { path = "../mt-core" }
moyo = { version = "0.17", optional = true }
nalgebra = { version = "0.35", optional = true }
num-complex.workspace = true
thiserror.workspace = true

[lints]
workspace = true
