[package]
name = "libmuffintin-coulomb"
description = "Representation-neutral finite-q Weinert/SPEX Coulomb operator over the product IR"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "muffintin_coulomb"

[dependencies]
libmuffintin-basis = { path = "../mt-basis" }
libmuffintin-core = { path = "../mt-core" }
libmuffintin-auxiliary-ir = { path = "../mt-auxiliary-ir" }
num-complex.workspace = true
thiserror.workspace = true

[dev-dependencies]
faer = { version = "0.22.6", default-features = false, features = ["std", "linalg"] }
libmuffintin-mpb = { path = "../mt-mpb" }
libmuffintin-thc = { path = "../mt-thc" }

[lints]
workspace = true
